<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>科宙斯塔防官网</title>
    <style>
        /* 全局样式重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }

        body {
            background-color: #1a1a2e; /* 深蓝紫色背景，类似图片背景 */
            overflow: hidden; /* 防止滚动条 */
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 过渡遮罩层 */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #16213e;
            z-index: 100;
            transform: scaleY(1);
            transform-origin: bottom;
            transition: transform 1s cubic-bezier(0.77, 0, 0.175, 1);
        }

        .overlay.hidden {
            transform: scaleY(0);
        }

        /* 主容器 */
        .container {
            text-align: center;
            opacity: 0;
            transform: translateY(50px);
            transition: all 1s ease-out 0.5s; /* 延迟0.5秒执行 */
            max-width: 600px;
            padding: 20px;
        }

        .container.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* 标题样式 */
        h1 {
            color: #fff;
            font-size: 2.5rem;
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
        }

        /* 图片样式 */
        .game-image {
            width: 80%;
            max-width: 400px;
            height: auto;
            border-radius: 10px;
            margin-bottom: 30px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        /* 按钮样式 */
        .download-btn {
            display: inline-block;
            padding: 15px 40px;
            background: linear-gradient(45deg, #00d2ff, #3a7bd5);
            color: white;
            text-decoration: none;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 50px;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 210, 255, 0.4);
            cursor: pointer;
            border: none;
        }

        .download-btn:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 8px 20px rgba(0, 210, 255, 0.6);
        }

        .download-btn:active {
            transform: translateY(0) scale(0.98);
        }
    </style>
</head>
<body>

    <!-- 过渡层 -->
    <div class="overlay" id="overlay"></div>

    <!-- 主要内容 -->
    <div class="container" id="container">
        <h1>欢迎访问 科宙斯塔防官网！</h1>
        
        <!-- 这里是您提供的图片 -->
        <img src="defense-image.png" alt="科宙斯塔防游戏画面" class="game-image" id="mainImage">
        
        <button class="download-btn" onclick="window.open('http://s.7723.cn/202610061632/b4ac29308189db25a5fc132acb56ba1c/up/2401896/387716', '_blank')">立即下载</button>
    </div>

    <script>
        // 页面加载完成后执行动画
        window.addEventListener('load', function() {
            const overlay = document.getElementById('overlay');
            const container = document.getElementById('container');

            // 1. 隐藏过渡层
            setTimeout(() => {
                overlay.classList.add('hidden');
            }, 100);

            // 2. 显示内容
            setTimeout(() => {
                container.classList.add('show');
            }, 600); // 等待过渡层动画进行到一半再显示内容，更丝滑
        });
    </script>
</body>
</html>
